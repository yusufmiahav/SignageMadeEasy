# Run from the repo root: docker compose -f hub/docker-compose.yml up -d --build
services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: signagemadeeasy-hub
    restart: unless-stopped
    # Without this, Docker's default json-file driver keeps every line the hub has
    # ever logged, forever — fine for weeks, not for a NAS meant to stay up for
    # months. Caps it at 3 x 10MB (~30MB) per container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # REQUIRED: the hub calls Pi IPs directly (pairing handshake, restart) and scans
    # its own /24 for unpaired displays. A default bridge network puts the container
    # on a different subnet than your physical LAN, so neither works — host
    # networking is what makes this a "central hub on the NAS" instead of an isolated
    # container. If your Docker setup can't do host networking (e.g. Docker Desktop
    # on macOS/Windows), use a macvlan network attached to your LAN interface instead.
    network_mode: host
    environment:
      - PORT=4000
      - SIGNAGE_DATA_DIR=/app/data
      # The PIN the control app asks for before it'll show or change anything on this
      # hub — see hub/README.md's "Login PIN" section. Defaults to Abc123 if unset;
      # change it here.
      - SIGNAGE_PIN=Abc123
      # Only needed on a multi-homed NAS (more than one NIC/subnet) — see
      # hub/README.md's "Multi-homed NAS" section. Uncomment and set to an address
      # every Pi can reach, regardless of which interface a pairing request arrives on.
      # - SIGNAGE_PUBLIC_HUB_URL=http://10.21.0.5:4000
    # The hub image now runs as a non-root user (uid/gid 1000, not 0). Because
    # ./data is a host bind mount (not a named volume), Docker never adjusts its
    # ownership for you — the Docker daemon creates it as root if it doesn't
    # already exist, so the container needs it made writable by uid 1000 once,
    # before the first `up` and again after upgrading an existing deployment
    # whose ./data predates this change:
    #   mkdir -p hub/data && sudo chown -R 1000:1000 hub/data
    volumes:
      - ./data:/app/data
